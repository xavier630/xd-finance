services:
  - type: web
    name: xd-finance-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npx tsx server/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: GITHUB_GIST_PAT
        sync: false
      - key: ALPHA_VANTAGE_KEY
        sync: false
